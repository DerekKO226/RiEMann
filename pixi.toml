[workspace]
name = "riemann"
description = "RiEMann: SE(3)-equivariant manipulation (training environment)"
# The torch stack comes from conda because pixi rejects the plain `linux_x86_64`
# wheels that PyTorch (2.0.1+cu118) and PyG publish, and because data.dgl.ai is
# unreachable from this network.
channels = ["pytorch", "nvidia", "pyg", "dglteam/label/cu118", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.8.*"
# Paper setup is torch 2.0.1. cu118 is used instead of cu117 because it has
# native sm_89 kernels for the RTX 4090.
pytorch = { version = "==2.0.1", build = "*cuda11.8*", channel = "pytorch" }
torchvision = { version = "==0.15.2", build = "*cu118*", channel = "pytorch" }
pytorch-cuda = { version = "==11.8", channel = "pytorch" }
pytorch-scatter = { version = "*", build = "py38_torch_2.0.*_cu118", channel = "pyg" }
pytorch-sparse = { version = "*", build = "py38_torch_2.0.*_cu118", channel = "pyg" }
pytorch-cluster = { version = "*", build = "py38_torch_2.0.*_cu118", channel = "pyg" }
dgl = { version = "==1.1.2.cu118", channel = "dglteam/label/cu118" }
# torch < 2.3 crashes with mkl >= 2024.1 (undefined symbol iJIT_NotifyEvent).
mkl = "<2024.1"
numpy = "<1.25"
scipy = "*"
tqdm = "*"

[pypi-dependencies]
e3nn = "==0.5.1"
omegaconf = "==2.3.0"
open3d = "==0.17.0"
potpourri3d = "==1.0.0"
transforms3d = "==0.4.1"

[tasks]
check = "python -c \"import torch, dgl, torch_scatter, torch_cluster, e3nn, open3d; print(torch.__version__, dgl.__version__, torch.cuda.is_available(), [torch.cuda.get_device_name(i) for i in range(torch.cuda.device_count())])\""

[tasks.train-seg]
description = "Step 1: train SE3SegNet -> experiments/{exp}/{task}/segnet.pth"
args = [{ arg = "exp", default = "mug" }, { arg = "task", default = "pick" }]
cmd = "python scripts/training/train_seg.py --exp_name {{ exp }} --pick_or_place {{ task }}"

[tasks.train-mani]
description = "Step 2: train SE3ManiNet (needs segnet.pth) -> experiments/{exp}/{task}/maninet.pth"
args = [{ arg = "exp", default = "mug" }, { arg = "task", default = "pick" }]
cmd = "python scripts/training/train_mani.py --exp_name {{ exp }} --pick_or_place {{ task }}"

[tasks.train]
description = "Run train-seg then train-mani"
args = [{ arg = "exp", default = "mug" }, { arg = "task", default = "pick" }]
cmd = "python scripts/training/train_seg.py --exp_name {{ exp }} --pick_or_place {{ task }} && python scripts/training/train_mani.py --exp_name {{ exp }} --pick_or_place {{ task }}"

[activation.env]
DGLBACKEND = "pytorch"
